<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717">
<title>Wolverine Timer</title>
<style>
:root{color-scheme:dark;--panel:#242424;--text:#f4f1e9;--muted:#aaa397;--accent:#e6a23c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#333,#171717 55%);color:var(--text);font-family:system-ui,sans-serif;display:grid;place-items:center;padding:22px}
main{width:min(100%,460px)}
h1{font-size:1.55rem;letter-spacing:.12em;margin:0 0 5px}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:22px}
.panel{background:var(--panel);border:1px solid #414141;border-radius:20px;padding:22px;box-shadow:0 14px 40px #0006}
.phase{color:var(--accent);font-weight:700;letter-spacing:.16em;font-size:.85rem}
.exercise{font-size:1.7rem;font-weight:750;margin:10px 0 0}
.time{font-size:5.2rem;line-height:1.15;font-weight:750;font-variant-numeric:tabular-nums;margin:12px 0}
.meta{color:var(--muted);font-size:.9rem}
.track{height:7px;background:#444;border-radius:9px;overflow:hidden;margin:20px 0}
.bar{height:100%;width:0;background:var(--accent);transition:width .2s}
.controls{display:flex;gap:10px;margin-top:20px}
button{flex:1;border:0;border-radius:12px;padding:14px 10px;font:inherit;font-weight:700;background:#3b3b3b;color:var(--text)}
button.primary{background:var(--accent);color:#171717}
button:active{transform:scale(.98)}
.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.settings label{font-size:.78rem;color:var(--muted)}
input{width:100%;margin-top:6px;padding:10px;border-radius:9px;border:1px solid #555;background:#171717;color:var(--text);font:inherit}
.list{margin-top:18px;color:var(--muted);font-size:.9rem;line-height:1.8}
.list strong{color:var(--text)}
@media(max-width:380px){.time{font-size:4.4rem}.panel{padding:17px}}
</style>
</head>
<body>
<main>
<h1>WOLVERINE TIMER</h1>
<div class="sub">TRAIN WITH CONTROL · MOVE WITH INTENTION</div>
<section class="panel">
<div class="phase" id="phase">READY</div>
<div class="exercise" id="exercise">準備できたら開始</div>
<div class="time" id="time">00:30</div>
<div class="meta" id="meta">全3種目 · 1 / 3ラウンド</div>
<div class="track"><div class="bar" id="bar"></div></div>
<div class="controls">
<button class="primary" id="start">スタート</button>
<button id="skip">スキップ</button>
<button id="reset">リセット</button>
</div>
<div class="settings">
<label>運動（秒）<input id="work" type="number" min="5" max="600" value="30"></label>
<label>休憩（秒）<input id="rest" type="number" min="0" max="300" value="15"></label>
<label>ラウンド<input id="rounds" type="number" min="1" max="20" value="3"></label>
</div>
<div class="list"><strong>種目：</strong>腕立て伏せ → プランク → スクワット</div>
</section>
</main>
<script>
const names=['腕立て伏せ','プランク','スクワット'];
const $=id=>document.getElementById(id);
let round=1,index=0,remaining=30,phase='ready',running=false,interval=null;
function render(){
  $('phase').textContent=({work:'WORK',rest:'REST',done:'COMPLETE',ready:'READY'})[phase];
  $('exercise').textContent=phase==='rest'?'休憩':phase==='done'?'おつかれさま！':phase==='ready'?'準備できたら開始':names[index];
  $('time').textContent='00:'+String(Math.max(0,remaining)).padStart(2,'0');
  $('meta').textContent=phase==='done'?'全メニュー終了':`全${names.length}種目 · ${round} / ${$('rounds').value}ラウンド`;
  const total=Math.max(1,phase==='rest'?+$('rest').value:+$('work').value);
  $('bar').style.width=((total-remaining)/total*100)+'%';
  $('start').textContent=running?'一時停止':phase==='ready'?'スタート':phase==='done'?'もう一度':'再開';
}
function stop(){running=false;clearInterval(interval);interval=null;render()}
function advance(){
  index++;
  if(index>=names.length){index=0;round++}
  if(round>+$('rounds').value){phase='done';remaining=0;stop();return}
  phase='work';remaining=+$('work').value;
}
function next(){
  if(phase==='work'&&+$('rest').value>0){phase='rest';remaining=+$('rest').value}
  else advance();
  render();
}
function tick(){if(remaining>0)remaining--;if(remaining<=0)next();else render()}
function reset(){
  stop();round=1;index=0;phase='ready';remaining=+$('work').value;render();
}
$('start').onclick=()=>{
  if(phase==='done')reset();
  if(phase==='ready'){phase='work';remaining=+$('work').value}
  running=!running;
  if(running)interval=setInterval(tick,1000);
  else{clearInterval(interval);interval=null}
  render();
};
$('skip').onclick=()=>{
  if(phase==='ready'){phase='work';remaining=+$('work').value}
  else next();
  render();
};
$('reset').onclick=reset;
['work','rest','rounds'].forEach(id=>$(id).onchange=()=>{
  if(phase==='ready')remaining=+$('work').value;
  render();
});
render();
</script>
</body>
</html>
